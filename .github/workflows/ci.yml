name: SENTINEL CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  QT_QPA_PLATFORM: offscreen
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

defaults:
  run:
    shell: bash

jobs:
  cli:
    name: CLI / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Create clean environment
        run: python tools/create_ci_env.py
      - name: Install base CLI without Qt
        run: python -m pip install .
      - name: Test CLI with expected Qt skips
        run: python tools/run_tests.py --mode cli
      - name: Check dependencies, compilation and whitespace
        run: |
          python -m pip check
          python -m compileall -q src tests tools
          git diff --check

  gui:
    name: GUI offscreen / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0
      - name: Create clean environment
        run: python tools/create_ci_env.py
      - name: Install optional GUI
        run: python -m pip install '.[gui]'
      - name: Test GUI with no skips allowed
        run: python tools/run_tests.py --mode gui
      - name: Check dependencies, compilation and whitespace
        run: |
          python -m pip check
          python -m compileall -q src tests tools
          git diff --check

  package:
    name: Packages / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Create clean environment
        run: python tools/create_ci_env.py
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Build wheel from sdist
        run: python -m build
      - name: Audit archives, install wheel without Qt and rebuild sdist
        run: python tools/check_packages.py
      - name: Check development environment
        run: python -m pip check

  audit:
    name: Runtime dependency audit / Python 3.14
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Create clean environment
        run: python tools/create_ci_env.py
      - name: Install auditor and build tools
        run: python -m pip install -r requirements-dev.txt
      - name: Build wheel for runtime resolution
        run: python -m build --wheel
      - name: Audit base runtime and optional GUI including transitive dependencies
        run: python tools/audit_runtime.py
      - name: Check development environment
        run: python -m pip check
