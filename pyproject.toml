[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-clipboard-firewall"
version = "0.0.1"
description = "Local inspection and sanitization of technical text"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.12.0,<7"]

[project.scripts]
sentinel = "sentinel.cli:main"

[project.gui-scripts]
sentinel-gui = "sentinel.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
